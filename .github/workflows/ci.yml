name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # The backend imports generated Prisma types, so the client has to exist
      # before anything is typechecked. No database connection is needed for this.
      - name: Generate Prisma client
        run: npx prisma generate --schema database/schema.prisma

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          # Only needs to be a valid URL for the build to succeed; the real value
          # is injected by Vercel at deploy time.
          VITE_API_URL: https://example.invalid/api/v1
